services:
  database:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: joomladb
      POSTGRES_USER: joomlauser
      POSTGRES_PASSWORD: joomlapassword
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-network

  joomla:
    image: joomla:latest
    container_name: joomla_app
    restart: always
    ports:
      - "8081:80"
    environment:
      JOOMLA_DB_HOST: database
      JOOMLA_DB_TYPE: pgsql
      JOOMLA_DB_USER: joomlauser
      JOOMLA_DB_PASSWORD: joomlapassword
      JOOMLA_DB_NAME: joomladb
    volumes:
      - joomla_data:/var/www/html
    depends_on:
      - database
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SERVER_ROOT_URL=http://localhost/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - app-network

  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: jupyter_notebook
    restart: always
    ports:
      - "8888:8888"
    command: start-notebook.sh --ServerApp.token='' --ServerApp.password='' --ServerApp.base_url='/jupyter/' --ServerApp.disable_check_xsrf=True
    volumes:
      - ./work:/home/jovyan/work
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - joomla
      - grafana
      - jupyter
    networks:
      - app-network

volumes:
  pg_data:
  grafana_data:
  joomla_data:

networks:
  app-network:
    driver: bridge