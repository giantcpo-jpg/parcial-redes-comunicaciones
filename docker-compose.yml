services:
  database:
    image: mariadb:10.11
    container_name: mariadb_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: joomladb
      MYSQL_USER: joomlauser
      MYSQL_PASSWORD: joomlapassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Credenciales de Administrador por defecto
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Permitir autenticación anónima como Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      # Subruta limpia
      - GF_SERVER_ROOT_URL=http://localhost/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app-network

  joomla:
    image: joomla:latest
    container_name: joomla_app
    restart: always
    ports:
      - "8081:80"
    environment:
      JOOMLA_DB_HOST: database
      JOOMLA_DB_USER: joomlauser
      JOOMLA_DB_PASSWORD: joomlapassword
      JOOMLA_DB_NAME: joomladb
    volumes:
      - joomla_data:/var/www/html
    depends_on:
      - database
    networks:
      - app-network

  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: jupyter_notebook
    restart: always
    ports:
      - "8888:8888"
    command: start-notebook.sh --ServerApp.token='' --ServerApp.password='' --ServerApp.base_url='/jupyter/' --ServerApp.disable_check_xsrf=True
    volumes:
      - ./work:/home/jovyan/work
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - joomla
      - grafana
      - jupyter
    networks:
      - app-network

volumes:
  db_data:
  grafana_data:
  joomla_data:
  jupyter_data:

networks:
  app-network:
    driver: bridge